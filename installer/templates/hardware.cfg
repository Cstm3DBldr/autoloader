# Hardware — {{BOARD_NAME}}
# GENERATED by installer/generate.py from your menuconfig answers.
# No timestamp on purpose: it would make every regeneration differ from
# the last, so nothing could ever report itself unchanged and verify.sh
# could never tell a real drift from the clock moving.
# Re-running the installer keeps any value you changed here.
#
# Autoloader hardware.cfg
#
# MCU: BTT MMB CAN V2.0 (single board for all 6 paths)
# Firmware: STM32G0B1 — 8 MHz crystal — CAN bus (PD0/PD1)
# Motor drivers: BTT EZ5160 Pro (TMC5160) — [tmc5160] with software SPI
#   SPI bus: spi2 — MISO=PB14, MOSI=PB15, SCK=PB13
#   M3 (drive)    CS: PB3  (SA_DRIVE_CS)    STEP=PC15 DIR=PC11 EN=PC10
#   M1 (selector) CS: PB5  (SA_SELECTOR_CS) STEP=PD4  DIR=PD3  EN=PD5
#   sense_resistor: {{TMC_SENSE_RESISTOR}} (standard EZ5160 Pro)
#
# To find canbus_uuid after flashing:
#   ~/klippy-env/bin/python ~/klipper/scripts/canbus_query.py can0

# ── Persistent variable storage ──────────────────────────────────────────
# sa_motion.py saves selector position and current path after every move.

# ── MCU ──────────────────────────────────────────────────────────────────

[mcu autoloader]
{% if CONN_CAN %}canbus_uuid: {{MCU_UUID}}{% endif %}{% if CONN_USB %}serial: {{MCU_SERIAL}}{% endif %}

# ── Drive motor — M3 (PC15/PC11/PC10, CS=PB3) ───────────────────────────
# Single feed gear that moves filament through the selected path.
# Servo must be engaged before running this motor.

[manual_stepper sa_drive]
step_pin: autoloader:SA_DRIVE_STEP
dir_pin: !autoloader:SA_DRIVE_DIR
enable_pin: !autoloader:SA_DRIVE_EN
microsteps: 16
rotation_distance: 5.7486
velocity: 50
accel: 400

[tmc5160 manual_stepper sa_drive]
cs_pin: autoloader:SA_DRIVE_CS
spi_software_miso_pin: autoloader:PB14
spi_software_mosi_pin: autoloader:PB15
spi_software_sclk_pin: autoloader:PB13
run_current: 0.800
sense_resistor: {{TMC_SENSE_RESISTOR}}
stealthchop_threshold: 999999
interpolate: True

# ── Selector motor — M1 (PD4/PD3/PD5, CS=PB5) ───────────────────────────
# Moves the drive gear carriage laterally to align with the active path.
# Home to endstop (SA_SELECTOR_STOP) before using, then position by mm.

[manual_stepper sa_selector]
step_pin: autoloader:SA_SELECTOR_STEP
dir_pin: !autoloader:SA_SELECTOR_DIR
enable_pin: !autoloader:SA_SELECTOR_EN
microsteps: 16
rotation_distance: 40.0
velocity: 200
accel: 800
endstop_pin: ^autoloader:SA_SELECTOR_STOP

[tmc5160 manual_stepper sa_selector]
cs_pin: autoloader:SA_SELECTOR_CS
spi_software_miso_pin: autoloader:PB14
spi_software_mosi_pin: autoloader:PB15
spi_software_sclk_pin: autoloader:PB13
run_current: 0.600
sense_resistor: {{TMC_SENSE_RESISTOR}}
stealthchop_threshold: 0
interpolate: True
driver_SGT: 1              # stallguard threshold for SA_CALIBRATE_SELECTOR (tune: lower = more sensitive)

# ── Sensorless stall detection — selector DIAG1 pin ─────────────────────────
# Reads PB9 (M1 DIAG) to detect when the selector motor stalls.
# Used ONLY by SA_CALIBRATE_SELECTOR for far-end detection.
# SA_HOME uses the physical endstop switch (SA_SELECTOR_STOP) and never touches this.
# Pin polarity: DIAG1 is open-drain, active-LOW on stall.
#   ^  = pull-up (needed since DIAG is open-drain)
#   !  = invert (LOW-on-stall becomes HIGH = PRESSED in Klipper)

[gcode_button selector_stall]
pin: ^!autoloader:SA_SELECTOR_DIAG
press_gcode:
release_gcode:

# ── Engage servo ──────────────────────────────────────────────────────────
# Clamps drive gear into the active path ("driven") or releases it ("neutral").
# initial_angle = disengaged so path is neutral at boot.

[servo sa_engage]
pin: autoloader:SA_SERVO
maximum_servo_angle: 180
minimum_pulse_width: 0.001
maximum_pulse_width: 0.002
initial_angle: 10

# ── Per-path encoders — one fixed encoder per filament path ──────────────
# Each encoder sits permanently inside its filament path, between the drive
# gear engagement point and the extruder. They never move.
# When the drive gear engages path N, only encoder N counts pulses.
# All 6 run simultaneously in the background via interrupt — no data loss.
# Calibrate each with: SA_CALIBRATE_ENCODER TOOL=N DISTANCE=100

{% for path %}[sa_encoder {{N}}]
sensor_pin: ^autoloader:SA_ENCODER_{{N}}
mm_per_pulse: 0.5

{% endfor %}

# ── Entry sensors — one per filament path ────────────────────────────────
# Fixed position sensors at the roll end of each path.
# Note: ^! = pull-up + invert (sensors read HIGH when empty on this hardware).
#
# No insert_gcode here on purpose. Klipper's RunoutHelper only fires
# insert_gcode when idle_timeout.state != "Printing", and idle_timeout
# flips to "Printing" on ANY gcode activity -- including an auto-park
# already running for another path. It also marks filament_present
# before that check returns, so the edge is consumed and never re-fires:
# insert a second spool while the first is parking and its park is lost
# outright. The autoloader's own state monitor polls these sensors at
# 1 Hz and queues SA_PARK itself, which cannot drop an insertion.

{% for path %}[filament_switch_sensor entry_sensor_{{N}}]
pause_on_runout: False
switch_pin: {{ENTRY_SENSOR_POLARITY}}autoloader:SA_ENTRY_{{N}}

{% endfor %}

# ── Toolhead filament sensors — one per toolhead (BTT EBB36, ^etN:PB8) ──────
# Detects filament past the extruder gears, entering the hotend.

{% if HAS_TOOLHEAD_SENSOR %}{% for path %}[filament_switch_sensor toolhead_sensor_{{N}}]
pause_on_runout: False
switch_pin: ^{{TOOLHEAD_MCU}}:PB8

{% endfor %}{% endif %}

# ── Extruder entry sensors — one per toolhead (BTT EBB36, ^etN:PB5) ─────────
# Detects filament at toolhead entry, before the extruder gears. Used by Bowden
# calibration and as the load target during automated loading (more accurate than tube_length).

{% if HAS_EXTRUDER_SENSOR %}{% for path %}[filament_switch_sensor extruder_sensor_{{N}}]
pause_on_runout: False
switch_pin: ^{{TOOLHEAD_MCU}}:PB5

{% endfor %}{% endif %}

# ── Main controller ───────────────────────────────────────────────────────
# The [autoloader] config section lives in parameters.cfg.
# All user-tunable values (servo angles, speeds, tip-form, park positions,
# selector cal, bowden lengths, etc.) are there — not here.
