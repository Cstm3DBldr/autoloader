# Pin Aliases — {{BOARD_NAME}}
# GENERATED by installer/generate.py on {{GENERATED_ON}}.
#
# Re-running the installer regenerates this file but keeps any value you
# changed. Settings you want to survive regardless belong in user.cfg.
#
# Rules:
#   - One [board_pins] block per MCU; the name MUST match the [mcu name].
#   - No polarity (^ or !) here — that goes on the use line in hardware.cfg.
#   - The last alias in the block has NO trailing comma.

[board_pins autoloader]
mcu: autoloader
aliases:
    # ── Drive motor ──────────────────────────────────────────────────────
    SA_DRIVE_STEP={{PIN_DRIVE_STEP}},
    SA_DRIVE_DIR={{PIN_DRIVE_DIR}},
    SA_DRIVE_EN={{PIN_DRIVE_ENABLE}},
    SA_DRIVE_CS={{PIN_DRIVE_CS}},
    SA_DRIVE_DIAG={{PIN_DRIVE_DIAG}},

    # ── Selector motor ───────────────────────────────────────────────────
    SA_SELECTOR_STEP={{PIN_SELECTOR_STEP}},
    SA_SELECTOR_DIR={{PIN_SELECTOR_DIR}},
    SA_SELECTOR_EN={{PIN_SELECTOR_ENABLE}},
    SA_SELECTOR_CS={{PIN_SELECTOR_CS}},
    SA_SELECTOR_DIAG={{PIN_SELECTOR_DIAG}},
    SA_SELECTOR_STOP={{PIN_SELECTOR_STOP}},

    # ── Engage servo ─────────────────────────────────────────────────────
    SA_SERVO={{PIN_SERVO}},

    # ── Per-path encoders ────────────────────────────────────────────────
{% for path %}    SA_ENCODER_{{N}}={{ENCODER_PIN}},
{% endfor %}
    # ── Per-path entry sensors. Last line has no comma. ──────────────────
{% for path %}    SA_ENTRY_{{N}}={{ENTRY_PIN}},
{% endfor %}
