# Autoloader main entry point — included from printer.cfg via:
#   [include autoloader/autoloader.cfg]
#
# autoloader MCU (BTT MMB CAN V2.0): UUID 329ce333239a — ACTIVE
# All 6 filament paths on one board.
#
# File roles:
#   pin_aliases.cfg   — physical hardware pins → human-readable aliases (only)
#   hardware.cfg      — MCU, drivers, steppers, servo, encoders, sensors (only)
#   parameters.cfg    — [autoloader] section: all user-tunable values
#   macros.cfg        — gcode_macro wrappers around the Python backend

[include pin_aliases.cfg]
[include hardware.cfg]
[include parameters.cfg]
[include macros.cfg]

# Toolhead status LEDs — OPT-IN, off by default. Uncomment the line below.
#
# Then copy the worked example into that directory and adapt it to your
# hardware:
#     mkdir -p ~/printer_data/config/autoloader/leds
#     cp ~/printer_data/config/autoloader/examples/leds.cfg ~/printer_data/config/autoloader/leds/
#
# `leds/` is yours: post_update.sh never writes there, so your edits survive
# every update. That is why the example does not live there. This file IS
# overwritten on update, so post_update.sh reads whether the line below is
# uncommented and puts it back the way you had it.
#
# READ docs/LEDS.md FIRST. The example defines ten STATUS_* macros that
# collide with the stock Voron stealthburner_leds.cfg, and Klipper refuses
# to start if both are present.
#[include leds/*.cfg]

# Dynamic calibration values — written immediately by SA_CALIBRATE_*, no restart needed.
# Keys: selector_position_N, bowden_length_N, encoder_mpp_N, drive_rotation_distance
[save_variables]
filename: ~/printer_data/config/autoloader/variables.cfg
