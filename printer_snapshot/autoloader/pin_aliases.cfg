# Pin Aliases — BTT MMB CAN v2.0
# GENERATED by installer/generate.py from your menuconfig answers.
# No timestamp on purpose: it would make every regeneration differ from
# the last, so nothing could ever report itself unchanged and verify.sh
# could never tell a real drift from the clock moving.
#
# Re-running the installer regenerates this file but keeps any value you
# changed. Settings you want to survive regardless belong in user.cfg.
#
# Rules:
#   - One [board_pins] block per MCU; the name MUST match the [mcu name].
#   - No polarity (^ or !) here — that goes on the use line in hardware.cfg.
#   - The last alias in the block has NO trailing comma.

[board_pins autoloader]
mcu: autoloader
aliases:
    # ── Drive motor ──────────────────────────────────────────────────────
    SA_DRIVE_STEP=PC15,
    SA_DRIVE_DIR=PC11,
    SA_DRIVE_EN=PC10,
    SA_DRIVE_CS=PB3,
    SA_DRIVE_DIAG=PB7,

    # ── Selector motor ───────────────────────────────────────────────────
    SA_SELECTOR_STEP=PD4,
    SA_SELECTOR_DIR=PD3,
    SA_SELECTOR_EN=PD5,
    SA_SELECTOR_CS=PB5,
    SA_SELECTOR_DIAG=PB9,
    SA_SELECTOR_STOP=PA15,

    # ── Engage servo ─────────────────────────────────────────────────────
    SA_SERVO=PA1,

    # ── Per-path encoders ────────────────────────────────────────────────
    SA_ENCODER_0=PC7,
    SA_ENCODER_1=PA9,
    SA_ENCODER_2=PB12,
    SA_ENCODER_3=PB10,
    SA_ENCODER_4=PB1,
    SA_ENCODER_5=PC5,
    # ── Per-path entry sensors. Last line has no comma. ──────────────────
    SA_ENTRY_0=PC6,
    SA_ENTRY_1=PA8,
    SA_ENTRY_2=PB11,
    SA_ENTRY_3=PB2,
    SA_ENTRY_4=PB0,
    SA_ENTRY_5=PC4
